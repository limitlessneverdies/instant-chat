<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Together</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,monospace}
    html,body{height:100%;background:#050505;color:#f2f2f2;overflow:hidden}
    body{display:flex;flex-direction:column}
    #join{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;background:#050505;z-index:10}
    #join.hidden{display:none}
    #join h1{font-size:22px;letter-spacing:2px}
    #join input{padding:12px 16px;font-size:16px;background:#111;border:1px solid #333;color:#eee;border-radius:8px;width:220px;text-align:center;outline:none}
    #join button{padding:12px 28px;font-size:15px;background:#fff;color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:600}
    #app{display:none;flex:1;flex-direction:column;min-height:0}
    #app.active{display:flex}
    #topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #1a1a1a;background:#0a0a0a}
    #topbar .title{font-size:13px;font-weight:600;letter-spacing:1px}
    #topbar .meta{font-size:12px;color:#888}
    #main{flex:1;display:flex;min-height:0}
    #stage{flex:1;position:relative;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;overflow:auto;align-content:start}
    .tile{position:relative;background:#0a0a0a;border:1px solid #1f1f1f;border-radius:10px;overflow:hidden;min-height:220px;display:flex;align-items:center;justify-content:center}
    .tile video{width:100%;height:100%;object-fit:contain;background:#000}
    .tile .label{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);padding:3px 9px;border-radius:6px;font-size:11px;backdrop-filter:blur(4px)}
    .tile .status{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.65);padding:3px 9px;border-radius:6px;font-size:11px;color:#6f6}
    #localPreview{position:absolute;right:14px;bottom:86px;width:240px;height:150px;border:2px solid #2a2a2a;border-radius:10px;overflow:hidden;background:#000;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.6)}
    #localPreview video{width:100%;height:100%;object-fit:contain}
    #localPreview .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);padding:2px 7px;border-radius:5px;font-size:10px}
    #controls{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:8px;z-index:6;background:rgba(10,10,10,.75);padding:8px 10px;border-radius:14px;backdrop-filter:blur(8px);border:1px solid #222}
    .btn{padding:10px 16px;background:#1a1a1a;color:#eee;border:1px solid #333;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
    .btn:hover{background:#262626}
    .btn.primary{background:#fff;color:#000;border-color:#fff}
    .btn.danger{background:#3a1111;color:#ff8a8a;border-color:#5a1a1a}
    .btn.active{background:#1f3a1f;color:#8fff8f;border-color:#2f5a2f}
    #chatPanel{width:340px;display:flex;flex-direction:column;border-left:1px solid #1a1a1a;background:#080808}
    #chatPanel.hidden{display:none}
    #chatHead{padding:10px 12px;border-bottom:1px solid #1a1a1a;font-size:12px;font-weight:600;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
    #chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
    .msg{max-width:85%;padding:7px 10px;background:#151515;border-radius:8px;word-break:break-word;font-size:13px;line-height:1.35}
    .msg.me{align-self:flex-end;background:#262626}
    .msg .who{font-size:10px;color:#777;margin-bottom:2px}
    #form{display:flex;gap:6px;padding:8px;border-top:1px solid #1a1a1a}
    #msg{flex:1;padding:9px 10px;background:#0f0f0f;border:1px solid #2a2a2a;color:#eee;border-radius:8px;outline:none;font-size:13px}
    #send{padding:9px 14px;background:#fff;color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:600}
    @media (max-width:760px){
      #chatPanel{position:absolute;inset:0;z-index:7;width:100%}
      #localPreview{width:160px;height:100px;bottom:78px}
    }
  </style>
</head>
<body>
  <div id="join">
    <h1>WATCH TOGETHER</h1>
    <div style="color:#888;font-size:13px">screen share + voice chat + text chat</div>
    <input id="roomIn" placeholder="room code" autocomplete="off">
    <button id="joinBtn">JOIN ROOM</button>
  </div>

  <div id="app">
    <div id="topbar">
      <div class="title">WATCH TOGETHER</div>
      <div class="meta" id="meta">connecting…</div>
    </div>
    <div id="main">
      <div id="stage"></div>
      <div id="chatPanel">
        <div id="chatHead">
          <span>CHAT</span>
          <button class="btn" id="chatToggle" style="padding:4px 10px;font-size:11px">HIDE</button>
        </div>
        <div id="chat"></div>
        <form id="form">
          <input id="msg" placeholder="message…" autocomplete="off" required>
          <button id="send">SEND</button>
        </form>
      </div>
    </div>
    <div id="localPreview">
      <video id="localScreen" autoplay muted playsinline></video>
      <div class="tag">YOU (screen)</div>
    </div>
    <div id="controls">
      <button class="btn primary" id="shareBtn">SHARE SCREEN</button>
      <button class="btn" id="muteBtn">MUTE MIC</button>
      <button class="btn" id="chatBtn">CHAT</button>
      <button class="btn" id="fsBtn">FULLSCREEN</button>
      <button class="btn danger" id="leaveBtn">LEAVE</button>
    </div>
  </div>

  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {getDatabase,ref,push,onChildAdded,onChildRemoved,set,remove,onDisconnect,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const cfg = {databaseURL:"https://anonchat-demo-default-rtdb.firebaseio.com/"};
    const app = initializeApp(cfg);
    const db = getDatabase(app);

    const id = Math.random().toString(36).slice(2,8);
    let room="", peersRef;
    let localMic=null, localScreen=null;
    const pcs=new Map();
    const remoteStreams=new Map();
    const remoteTiles=new Map();
    const remoteAudio=new Map();
    let peerCount=0;

    const joinEl=document.getElementById("join");
    const appdiv=document.getElementById("app");
    const rin=document.getElementById("roomIn");
    const jbtn=document.getElementById("joinBtn");
    const rhead=document.getElementById("roomHead");
    const topMeta=document.getElementById("meta");
    const stage=document.getElementById("stage");
    const chat=document.getElementById("chat");
    const form=document.getElementById("form");
    const msg=document.getElementById("msg");
    const chatPanel=document.getElementById("chatPanel");
    const chatToggle=document.getElementById("chatToggle");
    const shareBtn=document.getElementById("shareBtn");
    const muteBtn=document.getElementById("muteBtn");
    const chatBtn=document.getElementById("chatBtn");
    const fsBtn=document.getElementById("fsBtn");
    const leaveBtn=document.getElementById("leaveBtn");
    const localScreenEl=document.getElementById("localScreen");

    const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};

    function sanitize(v){return (v||"").trim().replace(/[^a-z0-9-_]/gi,'').slice(0,12);}

    function updateMeta(){ topMeta.textContent="room: "+room+"  •  peers: "+peerCount; }

    async function joinRoom(){
      room=sanitize(rin.value);
      if(!room) room="lobby";
      try{ localMic=await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(e){ localMic=null; }
      joinEl.classList.add("hidden");
      appdiv.classList.add("active");
      updateMeta();

      const myRef=ref(db,"rooms/"+room+"/peers/"+id);
      await set(myRef,{joined:Date.now()});
      onDisconnect(myRef).remove();

      peersRef=ref(db,"rooms/"+room+"/peers");
      onChildAdded(peersRef,snap=>{
        const rid=snap.key;
        if(rid===id) return;
        ensurePeer(rid);
        if(id<rid) maybeOffer(rid);
        refreshCount();
      });
      onChildRemoved(peersRef,snap=>{
        removePeer(snap.key);
        refreshCount();
      });

      const mySignals=ref(db,"rooms/"+room+"/signals/"+id);
      onChildAdded(mySignals,fromSnap=>{
        const fromId=fromSnap.key;
        const offersRef=ref(db,"rooms/"+room+"/signals/"+id+"/"+fromId+"/offers");
        const answersRef=ref(db,"rooms/"+room+"/signals/"+id+"/"+fromId+"/answers");
        const candsRef=ref(db,"rooms/"+room+"/signals/"+id+"/"+fromId+"/candidates");
        onChildAdded(offersRef,async s=>{
          const pc=ensurePeer(fromId);
          try{
            await pc.setRemoteDescription(new RTCSessionDescription(s.val().sdp));
            const ans=await pc.createAnswer();
            await pc.setLocalDescription(ans);
            push(ref(db,"rooms/"+room+"/signals/"+fromId+"/"+id+"/answers"),{sdp:pc.localDescription});
          }catch(e){}
          remove(s.ref);
        });
        onChildAdded(answersRef,async s=>{
          const pc=pcs.get(fromId);
          if(pc){
            try{ await pc.setRemoteDescription(new RTCSessionDescription(s.val().sdp)); }catch(e){}
          }
          remove(s.ref);
        });
        onChildAdded(candsRef,async s=>{
          const pc=pcs.get(fromId);
          if(pc && s.val().candidate){
            try{ await pc.addIceCandidate(new RTCIceCandidate(s.val().candidate)); }catch(e){}
          }
          remove(s.ref);
        });
      });

      const chatRef=ref(db,"rooms/"+room+"/chat");
      onChildAdded(chatRef,s=>{
        const d=s.val();
        const div=document.createElement("div");
        div.className="msg"+(d.id===id?" me":"");
        if(d.id!==id){const w=document.createElement("div");w.className="who";w.textContent=d.id;div.appendChild(w);}
        const t=document.createElement("div");t.textContent=d.text;div.appendChild(t);
        chat.appendChild(div);
        chat.scrollTop=chat.scrollHeight;
      });
      refreshCount();
    }

    function refreshCount(){
      // count peers from db snapshot not tracked; approximate via tiles
      peerCount=remoteTiles.size;
      updateMeta();
    }

    function ensurePeer(rid){
      if(pcs.has(rid)) return pcs.get(rid);
      const pc=new RTCPeerConnection(ICE);
      pcs.set(rid,pc);
      if(localMic) localMic.getTracks().forEach(t=>pc.addTrack(t,localMic));
      if(localScreen) localScreen.getTracks().forEach(t=>pc.addTrack(t,localScreen));
      pc.onicecandidate=e=>{
        if(e.candidate) push(ref(db,"rooms/"+room+"/signals/"+rid+"/"+id+"/candidates"),{candidate:e.candidate});
      };
      pc.ontrack=e=>{
        let stream=remoteStreams.get(rid);
        if(!stream){stream=new MediaStream();remoteStreams.set(rid,stream);}
        if(!stream.getTracks().some(t=>t.id===e.track.id)) stream.addTrack(e.track);
        renderRemote(rid,stream);
        e.track.onended=()=>renderRemote(rid,stream);
      };
      pc.onconnectionstatechange=()=>{
        if(pc.connectionState==="failed") try{pc.restartIce();}catch(e){}
        const t=remoteTiles.get(rid);
        if(t && t.status){
          t.status.textContent=pc.connectionState;
          t.status.style.color = pc.connectionState==="connected"?"#6f6":pc.connectionState==="failed"?"#f66":"#aa8";
        }
      };
      createTile(rid);
      return pc;
    }

    async function maybeOffer(rid){
      const pc=pcs.get(rid);
      if(!pc || pc.signalingState!=="stable") return;
      if(pc.localDescription && pc.localDescription.type==="offer") return;
      try{
        const offer=await pc.createOffer();
        await pc.setLocalDescription(offer);
        push(ref(db,"rooms/"+room+"/signals/"+rid+"/"+id+"/offers"),{sdp:pc.localDescription});
      }catch(e){}
    }

    async function renegotiate(rid){
      const pc=pcs.get(rid);
      if(!pc || pc.signalingState!=="stable") return;
      try{
        const offer=await pc.createOffer();
        await pc.setLocalDescription(offer);
        push(ref(db,"rooms/"+room+"/signals/"+rid+"/"+id+"/offers"),{sdp:pc.localDescription});
      }catch(e){}
    }

    function createTile(rid){
      if(remoteTiles.has(rid)) return;
      const tile=document.createElement("div");
      tile.className="tile";
      const v=document.createElement("video");
      v.autoplay=true;v.playsInline=true;
      const lab=document.createElement("div");
      lab.className="label";lab.textContent=rid;
      const st=document.createElement("div");
      st.className="status";st.textContent="connecting";
      tile.appendChild(v);tile.appendChild(lab);tile.appendChild(st);
      stage.appendChild(tile);
      remoteTiles.set(rid,{tile,video:v,status:st});
      const a=document.createElement("audio");
      a.autoplay=true;
      document.body.appendChild(a);
      remoteAudio.set(rid,a);
    }

    function renderRemote(rid,stream){
      const t=remoteTiles.get(rid);
      if(t) t.video.srcObject=stream;
      const a=remoteAudio.get(rid);
      if(a) a.srcObject=stream;
    }

    function removePeer(rid){
      const pc=pcs.get(rid);
      if(pc) try{pc.close();}catch(e){}
      pcs.delete(rid);
      remoteStreams.delete(rid);
      const t=remoteTiles.get(rid);
      if(t) t.tile.remove();
      remoteTiles.delete(rid);
      const a=remoteAudio.get(rid);
      if(a) a.remove();
      remoteAudio.delete(rid);
      refreshCount();
    }

    async function startShare(){
      try{
        localScreen=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
        localScreen.getTracks().forEach(t=>{
          t.onended=()=>stopShare();
          pcs.forEach(pc=>pc.addTrack(t,localScreen));
        });
        localScreenEl.srcObject=localScreen;
        shareBtn.textContent="STOP SHARE";
        shareBtn.classList.add("active");
        for(const rid of pcs.keys()) await renegotiate(rid);
      }catch(e){}
    }

    function stopShare(){
      if(!localScreen) return;
      localScreen.getTracks().forEach(t=>{
        pcs.forEach(pc=>{
          const sender=pc.getSenders().find(s=>s.track===t);
          if(sender) try{pc.removeTrack(sender);}catch(e){}
        });
        t.stop();
      });
      localScreen=null;
      localScreenEl.srcObject=null;
      shareBtn.textContent="SHARE SCREEN";
      shareBtn.classList.remove("active");
      for(const rid of pcs.keys()) renegotiate(rid);
    }

    function toggleMute(){
      if(!localMic) return;
      const enabled=localMic.getAudioTracks().some(t=>t.enabled);
      localMic.getAudioTracks().forEach(t=>t.enabled=!enabled);
      muteBtn.textContent=enabled?"UNMUTE":"MUTE MIC";
      muteBtn.classList.toggle("active",!enabled);
    }

    jbtn.onclick=joinRoom;
    rin.addEventListener("keydown",e=>{if(e.key==="Enter") joinRoom();});
    shareBtn.onclick=()=>{ if(localScreen) stopShare(); else startShare(); };
    muteBtn.onclick=toggleMute;
    chatBtn.onclick=()=>{ chatPanel.classList.toggle("hidden"); chatBtn.classList.toggle("active",!chatPanel.classList.contains("hidden")); };
    chatToggle.onclick=()=>{ chatPanel.classList.add("hidden"); };
    fsBtn.onclick=async()=>{ try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(e){} };
    leaveBtn.onclick=()=>location.reload();

    form.onsubmit=e=>{
      e.preventDefault();
      const t=msg.value.trim();
      if(!t) return;
      push(ref(db,"rooms/"+room+"/chat"),{id,text:t,ts:serverTimestamp()});
      msg.value="";
    };
  </script>
</body>
</html>
