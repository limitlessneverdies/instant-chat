<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Chat</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:monospace}
    body{background:#000;color:#eee;height:100dvh;display:flex;flex-direction:column}
    #join{display:flex;align-items:center;justify-content:center;height:100dvh;flex-direction:column;gap:10px;text-align:center}
    #join.hidden{display:none}
    #app{display:none;flex-direction:column;height:100dvh}
    #app.active{display:flex}
    header{padding:10px;border-bottom:1px solid #222;text-align:center;font-size:12px}
    #chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
    .msg{max-width:80%;padding:6px 10px;background:#151515;word-break:break-word}
    .me{align-self:flex-end;background:#333}
    #form{display:flex;gap:6px;padding:10px;border-top:1px solid #222}
    #roomIn,#msg{flex:1;padding:8px;background:#000;border:1px solid #333;color:#eee;outline:none}
    #joinBtn,#send{padding:8px 14px;background:#eee;color:#000;border:none;cursor:pointer}
  </style>
</head>
<body>
  <div id="join">
    <div>ENTER ROOM CODE</div>
    <input id="roomIn" placeholder="e.g bro" autocomplete="off">
    <button id="joinBtn">JOIN</button>
  </div>

  <div id="app">
    <header id="roomHead">ROOM:</header>
    <div id="chat"></div>
    <form id="form">
      <input id="msg" placeholder="type..." autocomplete="off" required>
      <button id="send">SEND</button>
    </form>
  </div>

  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {getDatabase,ref,push,onChildAdded,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const cfg = {databaseURL:"https://anonchat-demo-default-rtdb.firebaseio.com/"};
    const app = initializeApp(cfg);
    const db = getDatabase(app);

    const id = Math.random().toString(36).slice(2,6);
    let room="", refm;

    const join = document.getElementById("join");
    const appdiv = document.getElementById("app");
    const rin = document.getElementById("roomIn");
    const jbtn = document.getElementById("joinBtn");
    const rhead = document.getElementById("roomHead");
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");

    function joinRoom(){
      room = rin.value.trim().replace(/[^a-z0-9-_]/gi,'').slice(0,12);
      if(!room) room = "lobby";
      join.classList.add("hidden");
      appdiv.classList.add("active");
      rhead.textContent = "ROOM: " + room;
      refm = ref(db, "rooms/"+room+"/messages");
      onChildAdded(refm, s=>{
        const d = s.val();
        const div = document.createElement("div");
        div.className = "msg" + (d.id===id ? " me" : "");
        div.textContent = d.text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      });
    }

    jbtn.onclick = joinRoom;
    rin.addEventListener("keydown", e=>{ if(e.key==="Enter") joinRoom(); });

    form.onsubmit = e=>{
      e.preventDefault();
      const t = msg.value.trim();
      if(!t || !refm) return;
      push(refm, {id, text:t, ts: serverTimestamp()});
      msg.value = "";
    };
  </script>
</body>
</html>
